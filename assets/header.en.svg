<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Ethan Wu, MD — Sports Medicine · PM&amp;R · Pain Medicine">
  <title>Ethan Wu, MD — Sports Medicine · PM&amp;R · Pain Medicine</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/><stop offset="55%" stop-color="#0369a1"/><stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="240"/></clipPath>
  </defs>
  <style>
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-450px); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw  { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes run   { from { stroke-dashoffset: 1060; } to { stroke-dashoffset: 0; } }
    .wave { animation: drift linear infinite; }
    .w1 { animation-duration: 12s; } .w2 { animation-duration: 18s; } .w3 { animation-duration: 26s; }
    .name { animation: rise .9s ease-out both; }
    .role { animation: rise .9s ease-out .25s both; }
    .meta { animation: rise .9s ease-out .45s both; }
    .ecg   { stroke-dasharray: 1000; animation: draw 2.4s ease-out .3s both; }
    .pulse { stroke-dasharray: 60 1000; animation: run 4.5s linear 2.7s infinite both; }
    /* 使用者開啟「減少動態效果」時全部停下，只留靜態版面 */
    @media (prefers-reduced-motion: reduce) {
      .wave, .name, .role, .meta, .ecg, .pulse { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
      .pulse { display: none; }
    }
  </style>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <g class="wave w3" opacity=".14"><path fill="#ffffff" d="M0,196 C75,178 150,214 225,196 C300,178 375,214 450,196 C525,178 600,214 675,196 C750,178 825,214 900,196 C975,178 1050,214 1125,196 C1200,178 1275,214 1350,196 C1425,178 1500,214 1575,196 L1575,400 L0,400 Z"/></g>
    <g class="wave w2" opacity=".22"><path fill="#ffffff" d="M0,210 C75,192 150,228 225,210 C300,192 375,228 450,210 C525,192 600,228 675,210 C750,192 825,228 900,210 C975,192 1050,228 1125,210 C1200,192 1275,228 1350,210 C1425,192 1500,228 1575,210 L1575,400 L0,400 Z"/></g>
    <g class="wave w1" opacity=".30"><path fill="#ffffff" d="M0,224 C75,206 150,242 225,224 C300,206 375,242 450,224 C525,206 600,242 675,224 C750,206 825,242 900,224 C975,206 1050,242 1125,224 C1200,206 1275,242 1350,224 C1425,206 1500,242 1575,224 L1575,400 L0,400 Z"/></g>
    <path class="ecg" pathLength="1000" d="M0,176 L70,176 L70,176 L80,170 L90,176 L98,176 L102,182 L108,142 L114,190 L120,176 L132,176 L144,166 L156,176 L330,176 L330,176 L340,170 L350,176 L358,176 L362,182 L368,142 L374,190 L380,176 L392,176 L404,166 L416,176 L790,176 L790,176 L800,170 L810,176 L818,176 L822,182 L828,142 L834,190 L840,176 L852,176 L864,166 L876,176 L1050,176 L1050,176 L1060,170 L1070,176 L1078,176 L1082,182 L1088,142 L1094,190 L1100,176 L1112,176 L1124,166 L1136,176 L1200,176" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round"/>
    <path class="pulse" pathLength="1000" d="M0,176 L70,176 L70,176 L80,170 L90,176 L98,176 L102,182 L108,142 L114,190 L120,176 L132,176 L144,166 L156,176 L330,176 L330,176 L340,170 L350,176 L358,176 L362,182 L368,142 L374,190 L380,176 L392,176 L404,166 L416,176 L790,176 L790,176 L800,170 L810,176 L818,176 L822,182 L828,142 L834,190 L840,176 L852,176 L864,166 L876,176 L1050,176 L1050,176 L1060,170 L1070,176 L1078,176 L1082,182 L1088,142 L1094,190 L1100,176 L1112,176 L1124,166 L1136,176 L1200,176" fill="none" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
  <g font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans GB',sans-serif" text-anchor="middle">
    <text class="name" x="600" y="74" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="2">Ethan Wu, MD</text>
    <text class="role" x="600" y="112" fill="#e0f2fe" font-size="21" font-weight="600" letter-spacing="1.5">Sports Medicine · PM&amp;R · Pain Medicine</text>
    <text class="meta" x="600" y="140" fill="#bae6fd" font-size="15" letter-spacing="1">Physician　·　Builder　·　吳易澄</text>
