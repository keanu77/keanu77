<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Turning clinic questions into tools people can use">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/><stop offset="55%" stop-color="#0369a1"/><stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="130"/></clipPath>
  </defs>
  <style>
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-450px); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw  { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes run   { from { stroke-dashoffset: 1060; } to { stroke-dashoffset: 0; } }
    .wave { animation: drift linear infinite; }
    .w1 { animation-duration: 12s; } .w2 { animation-duration: 18s; } .w3 { animation-duration: 26s; }
    .name { animation: rise .9s ease-out both; }
    .role { animation: rise .9s ease-out .25s both; }
    .meta { animation: rise .9s ease-out .45s both; }
    .ecg   { stroke-dasharray: 1000; animation: draw 2.4s ease-out .3s both; }
    .pulse { stroke-dasharray: 60 1000; animation: run 6s linear 2.7s infinite both; }
    /* 使用者開啟「減少動態效果」時全部停下，只留靜態版面 */
    @media (prefers-reduced-motion: reduce) {
      .wave, .name, .role, .meta, .ecg, .pulse { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
      .pulse { display: none; }
    }
  </style>
  <rect width="1200" height="130" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <g class="wave w2" opacity=".20"><path fill="#ffffff" d="M0,34 C75,16 150,52 225,34 C300,16 375,52 450,34 C525,16 600,52 675,34 C750,16 825,52 900,34 C975,16 1050,52 1125,34 C1200,16 1275,52 1350,34 C1425,16 1500,52 1575,34 L1575,0 L0,0 Z"/></g>
    <g class="wave w1" opacity=".28"><path fill="#ffffff" d="M0,18 C75,0 150,36 225,18 C300,0 375,36 450,18 C525,0 600,36 675,18 C750,0 825,36 900,18 C975,0 1050,36 1125,18 C1200,0 1275,36 1350,18 C1425,0 1500,36 1575,18 L1575,0 L0,0 Z"/></g>
    <path class="ecg" pathLength="1000" d="M0,70 L520,70 L520,70 L530,64 L540,70 L548,70 L552,76 L558,36 L564,84 L570,70 L582,70 L594,60 L606,70 L1200,70" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2" stroke-linejoin="round"/>
    <path class="pulse" pathLength="1000" d="M0,70 L520,70 L520,70 L530,64 L540,70 L548,70 L552,76 L558,36 L564,84 L570,70 L582,70 L594,60 L606,70 L1200,70" fill="none" stroke="#34d399" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
  <text class="meta" x="600" y="110" text-anchor="middle" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Hiragino Sans GB',sans-serif" fill="#e0f2fe" font-size="16" letter-spacing="1.5">Turning clinic questions into tools people can use　·　sportsmedicine.tw</text>
</svg>
